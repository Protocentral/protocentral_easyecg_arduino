sentence=Arduino library for the ProtoCentral easyECG single-lead ECG breakout board.
paragraph=Reads a single-lead ECG from the ProtoCentral easyECG board over I2C. Samples on a fixed clock and applies a mains notch and a 40 Hz Butterworth low-pass in software, detects heart rate, and flags amplifier saturation. Standalone - no external dependencies. For research and education only - not a medical device.
